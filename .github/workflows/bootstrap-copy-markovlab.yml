name: Bootstrap copy from markovlab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 1

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: castefeudal/markovlab
          ref: main
          path: source
          fetch-depth: 1

      - name: Replace target contents with source snapshot
        run: |
          rsync -a --delete --exclude='.git/' source/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy current markovlab main snapshot" || exit 0
          git push origin HEAD:main
