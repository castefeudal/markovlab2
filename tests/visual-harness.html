<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MARKOVLAB responsive QA</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;background:#d9ded8;font:12px system-ui;color:#23342c}
  iframe{display:block;margin:16px;border:0;background:white;box-shadow:0 12px 48px #21352c33}
</style>
<iframe id="frame" title="MARKOVLAB responsive viewport"></iframe>
<script>
  const p=new URLSearchParams(location.search),width=Number(p.get('width'))||390,height=Number(p.get('height'))||844,lang=p.get('lang')||'ru',theme=p.get('theme')||'light',route=p.get('route')||'#home';
  const frame=document.querySelector('#frame');
  frame.width=width;frame.height=height;
  try{const key='markovlab-state-v3',state=JSON.parse(localStorage.getItem(key)||'{}');localStorage.setItem(key,JSON.stringify({...state,version:3,lang,theme,onboardingDismissed:true}))}catch{}
  frame.src=`../index.html${route}`;
</script>
</html>
